name: Daily Brief

on:
  schedule:
    # Goal: finish around 6am Vancouver (UTC-7 year round, no DST shift).
    # GitHub fires scheduled jobs 6 to 12 hours late (observed 6.2h to 11.7h
    # across the last 12 runs), so the cron is set early on purpose:
    # 01:07 UTC is 6:07pm Vancouver the evening before. With that delay the
    # run starts between roughly 12:20am and 5:50am Vancouver and takes 5 to
    # 20 minutes. Do not move it earlier than 01:00 UTC: a run that starts
    # before midnight Vancouver would be dated as the previous day.
    # Offset a few minutes to avoid the :00 stampede.
    - cron: '7 1 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run pipeline
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_API_BASE_URL: https://opencode.ai/zen/go/v1
          OPENCODE_SESSION_ID: news-reader-${{ github.run_id }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SUBSCRIBE_STATS_TOKEN: ${{ secrets.SUBSCRIBE_STATS_TOKEN }}
        run: |
          set -o pipefail
          python run_pipeline.py 2>&1 | tee pipeline.log

      - name: Notify on failure
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python scripts/failure_notice.py --log pipeline.log --data-dir data
