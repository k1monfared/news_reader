name: Daily Brief

on:
  schedule:
    # 6am US Pacific. 13:07 UTC during PDT (Mar-Nov), 14:07 UTC during PST.
    # GitHub fires scheduled jobs in UTC and does not follow DST, so the local
    # start drifts by one hour in standard time. Offset a few minutes to avoid
    # the :00 stampede. GitHub's scheduler has been firing this 4-8h late under
    # load, so completion lands later.
    - cron: '7 13 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run pipeline
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_API_BASE_URL: https://opencode.ai/zen/go/v1
          OPENCODE_SESSION_ID: news-reader-${{ github.run_id }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SUBSCRIBE_STATS_TOKEN: ${{ secrets.SUBSCRIBE_STATS_TOKEN }}
        run: |
          set -o pipefail
          python run_pipeline.py 2>&1 | tee pipeline.log

      - name: Notify on failure
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python scripts/failure_notice.py --log pipeline.log --data-dir data
