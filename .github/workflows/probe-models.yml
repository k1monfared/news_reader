name: Probe Models (Phase 0)

# Phase 0 dry run: authenticated probe of Zen/Go models with the real key.
# No pipeline changes, no commits. Manually dispatched; uploads
# probe_results.json so model/provider decisions are made on evidence.
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'API base (zen or go catalog)'
        default: 'https://opencode.ai/zen/v1'
        required: false
        type: string
      models:
        description: 'Comma-separated model ids (empty = auto free candidates)'
        default: ''
        required: false
        type: string
      session_id:
        description: 'Stable session id for x-opencode-session (Go catalog)'
        default: ''
        required: false
        type: string
      max_tokens:
        description: 'Completion budget per probe call (reasoning models need ~60)'
        default: '5'
        required: false
        type: string

permissions:
  contents: read
  actions: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Probe models (authenticated)
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: >-
          python scripts/probe_models.py --out probe_results.json
          --base "${{ inputs.base_url }}"
          --models "${{ inputs.models }}"
          --session-id "${{ inputs.session_id }}"
          --max-tokens "${{ inputs.max_tokens }}"

      - name: Upload probe results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-results
          path: probe_results.json
          retention-days: 30
