# config.yaml
# Iran War News Pipeline Configuration
# All tunable parameters live here, not in code.

# ---------------------------------------------------------------------------
# Sources
# ---------------------------------------------------------------------------
# Each source specifies: name, type (rss/scrape), URL, language, max_items,
# known_biases, reliability_notes, filter_instructions, debias_instructions.
# Adding a new source means adding a config entry and (if scrape) a fetcher class.
sources:
  - name: aljazeera
    type: rss
    url: "https://www.aljazeera.com/xml/rss/all.xml"
    language: en
    max_items: 100
    known_biases: "Pro-Arab, critical of Israel, editorializes framing"
    reliability_notes: "Generally reliable"
    filter_instructions: "Watch for editorialized framing of events. Must be directly about Iran war to include."
    debias_instructions: "Note when framing differs from wire services"

  - name: reuters
    type: rss
    url: "https://www.rss-bridge.org/bridge01/?action=display&bridge=Reuters&feed=world&format=Atom"
    language: en
    max_items: 50
    known_biases: "Neutral wire service"
    reliability_notes: "High, fact-checked. Broad world feed, 80% not Iran-related."
    filter_instructions: "Broad world feed, include ONLY if directly about Iran war (Iran/Hormuz/IRGC). Exclude all other world news."
    debias_instructions: "Generally reliable, minimal debias needed"

  - name: france24
    type: rss
    url: "https://www.france24.com/en/middle-east/rss"
    language: en
    max_items: 100
    known_biases: "French/European perspective, moderate editorial tone"
    reliability_notes: "Generally reliable, strong on diplomacy coverage. Middle-east feed has higher Iran yield."
    filter_instructions: "Good for European diplomatic angles and UN coverage. Include only Iran war items."
    debias_instructions: "May emphasize European diplomatic efforts over other actors"

  - name: euronews
    type: rss
    url: "https://www.euronews.com/rss"
    language: en
    max_items: 50
    known_biases: "Pan-European perspective, EU-aligned framing"
    reliability_notes: "Generally reliable, but broad all-news feed. Very low Iran yield."
    filter_instructions: "Very broad feed, 90% not Iran-related. Exclude unless directly about Iran war. Do not include general Europe, tech, or disaster news without Iran link."
    debias_instructions: "May overweight EU policy responses relative to other actors"

  - name: bbc
    type: rss
    url: "https://feeds.bbci.co.uk/news/world/middle_east/rss.xml"
    language: en
    max_items: 100
    known_biases: "Mainstream Western public broadcaster, UK Foreign Office-aligned framing on diplomatic disputes"
    reliability_notes: "High, wire-grade editorial standards. Middle-east feed moderate Iran yield."
    filter_instructions: "Middle-east feed, but still include ONLY Iran war items. Exclude other Middle East news without Iran link."
    debias_instructions: "May center UK/European diplomatic positions; compare against regional outlets"

  - name: jpost
    type: rss
    url: "https://www.jpost.com/rss/rssfeedsfrontpage.aspx"
    language: en
    max_items: 50
    known_biases: "Israeli perspective, security-first framing, tends toward government-aligned coverage of the conflict"
    reliability_notes: "Reliable for Israeli official positions; opinion content mixed with news in feed. Broad frontpage."
    filter_instructions: "Broad frontpage, 80% not Iran-related. Include ONLY if directly about Iran war, not general Israel politics."
    debias_instructions: "Note when Israeli government claims are reported without independent confirmation"

  - name: mee
    type: rss
    url: "https://www.middleeasteye.net/rss"
    language: en
    max_items: 75
    known_biases: "Independent regional outlet, critical of US/Israeli intervention, Gulf geopolitics skepticism"
    reliability_notes: "Strong original regional reporting, higher Iran yield."
    filter_instructions: "Higher Iran yield, but still exclude unless directly about Iran war."
    debias_instructions: "Note when framing attributes motives to US/Israel beyond reported facts"

  - name: npr
    type: rss
    url: "https://feeds.npr.org/1004/rss.xml"
    language: en
    max_items: 30
    known_biases: "US public broadcaster, measured tone, centers American policy debate"
    reliability_notes: "High editorial standards; world feed is small and general, very low Iran yield."
    filter_instructions: "Very small general feed, expect low conflict yield. Include ONLY direct Iran war items, exclude all other US domestic/world news."
    debias_instructions: "May frame events through US domestic politics lens"

  - name: dw
    type: rss
    url: "https://rss.dw.com/xml/rss-en-all"
    language: en
    max_items: 50
    known_biases: "German international public broadcaster, neutral tone, European diplomatic framing"
    reliability_notes: "High editorial standards; broad all-news feed, very low Iran yield like Euronews."
    filter_instructions: "Very broad feed, 90% not Iran-related. Exclude unless directly about Iran war. Do not include German domestic or non-Iran tech."
    debias_instructions: "May emphasize German/EU diplomatic positions over regional actors"

  - name: thehindu
    type: rss
    url: "https://www.thehindu.com/news/international/feeder/default.rss"
    language: en
    max_items: 50
    known_biases: "Indian English-language daily, professional non-aligned editorial tradition, Global South perspective"
    reliability_notes: "Reliable newsroom, but international feed is broad, low Iran yield."
    filter_instructions: "Broad international feed, low Iran yield. Include ONLY direct Iran war items, exclude other world news."
    debias_instructions: "May frame Western actions through Global South critique without noting regional actor conduct"

# ---------------------------------------------------------------------------
# Models
# ---------------------------------------------------------------------------
# `default` drives the English pipeline stages, `translate_fa` overrides the
# Farsi translation/bias-sync stages (falls back to `default` when unset).
# When a model fails at runtime (rate limited, provider outage, or empty
# responses), `fallbacks` are tried in order. Order follows the Artificial
# Analysis Intelligence Index; hy3-free ranks higher than nemotron/mimo but
# has exhibited empty-content responses, so it sits last.
models:
  default: muse-spark-1.2-contributor-free
  translate_fa: muse-spark-1.2-contributor-free
  fallbacks:
    - nemotron-3-ultra-free
    - mimo-v2.5-free
    - hy3-free

# ---------------------------------------------------------------------------
# Dynamic Buckets
# ---------------------------------------------------------------------------
# Buckets are ordered dynamically in the report: buckets with more items or
# higher-confidence items appear first. Empty buckets are omitted entirely.
buckets:
  - name: "Military Operations"
    description: "Military operations, strikes, troop movements, and combat events"
    keywords:
      - strike
      - airstrike
      - missile
      - drone
      - military
      - troops
      - deployment
      - offensive
      - combat
      - bombing
      - casualties
      - IRGC
      - IDF
      - Pentagon

  - name: "Inside Iran"
    description: "Protests, civilians, domestic governance, and internal developments in Iran"
    keywords:
      - protest
      - Tehran
      - IRGC domestic
      - Khamenei
      - Raisi
      - Iranian people
      - civil unrest
      - crackdown
      - dissent
      - regime
      - domestic policy

  - name: "US Policy"
    description: "United States policy decisions, statements, and actions related to the conflict"
    keywords:
      - White House
      - Congress
      - Biden
      - State Department
      - CENTCOM
      - US military
      - American
      - Washington
      - Pentagon policy
      - executive order

  - name: "Israel Policy"
    description: "Israel policy decisions, statements, and actions related to the conflict"
    keywords:
      - Netanyahu
      - Knesset
      - IDF policy
      - Mossad
      - Israeli government
      - Tel Aviv
      - Jerusalem
      - Israel defense
      - Iron Dome
      - Israeli military

  - name: "Diplomacy"
    description: "Diplomatic meetings, negotiations, proposals, and peace efforts"
    keywords:
      - negotiations
      - ceasefire
      - talks
      - summit
      - treaty
      - UN resolution
      - mediator
      - diplomatic
      - envoy
      - peace process
      - de-escalation
      - JCPOA

  - name: "Regional Actors"
    description: "Actions and positions of regional players including Arab states, Turkey, and proxies"
    keywords:
      - Hezbollah
      - Houthi
      - Saudi Arabia
      - UAE
      - Turkey
      - Iraq
      - Syria
      - proxy
      - Gulf states
      - Qatar
      - Jordan
      - Lebanon

  - name: "International"
    description: "European, UN, and other international responses and involvement"
    keywords:
      - EU
      - United Nations
      - NATO
      - G7
      - China
      - Russia
      - international community
      - Security Council
      - IAEA
      - sanctions vote
      - European

  - name: "Economy"
    description: "Oil markets, sanctions, Strait of Hormuz, financial impacts, and trade"
    keywords:
      - oil
      - sanctions
      - Hormuz
      - crude
      - OPEC
      - trade
      - economic
      - markets
      - energy
      - inflation
      - currency
      - rial
      - financial

  - name: "Other"
    description: "Catch-all for items that do not fit other buckets"
    keywords: []

# ---------------------------------------------------------------------------
# Schedule
# ---------------------------------------------------------------------------
schedule:
  timezone: "America/Vancouver"
  run_hour: 8
  run_minute: 0

# ---------------------------------------------------------------------------
# Budget
# ---------------------------------------------------------------------------
budget:
  max_cost_per_run_usd: 10.00
  alert_threshold_usd: 8.0

# ---------------------------------------------------------------------------
# Audit
# ---------------------------------------------------------------------------
# Tracks prompt versions per run and records cost breakdowns.
# Each run writes a run_meta.json with prompt versions, token counts,
# per-stage cost, and total cost for reproducibility and regression tracking.
audit:
  log_prompt_versions: true
  log_token_counts: true
  log_cost_per_stage: true
  retention_days: 30

# ---------------------------------------------------------------------------
# Development Tracking
# ---------------------------------------------------------------------------
development_tracking:
  lookback_days: 7
  similarity_threshold: 0.25

# ---------------------------------------------------------------------------
# Pipeline Settings
# ---------------------------------------------------------------------------
pipeline:
  dedup_similarity_threshold: 0.85
  filter_confidence_threshold: 0.5
  max_report_bullets: 5
  min_report_bullets: 0
  cache_ttl_hours: 24
  # Deterministic Iran war keyword signals used by filter pre/post checks.
  # An item must contain one of these to be considered for the brief.
  iran_keywords:
    - iran
    - iranian
    - irgc
    - qods
    - quds
    - khamenei
    - pezeshkian
    - tehran
    - hormuz
    - persian gulf
    - natanz
    - fordow
    - bushehr
    - parchin
    - kharg
    - larak
    - ahvaz
    - bandar abbas
    - islamic republic
    - supreme leader
    - centrifuge
    - enrichment

# ---------------------------------------------------------------------------
# Publish Settings
# ---------------------------------------------------------------------------
publish:
  method: github_pages
  branch: master
  site_dir: docs

# ---------------------------------------------------------------------------
# Paths
# ---------------------------------------------------------------------------
paths:
  data_dir: data
  prompts_dir: prompts
  logs_dir: logs

# ---------------------------------------------------------------------------
# Farsi translation (post-publish stage)
# ---------------------------------------------------------------------------
# When enabled, publish skips git and translate_fa handles the atomic
# English + Farsi commit/push. Category translations are fixed so every
# day's Farsi brief uses the same section headers.
translate_fa:
  enabled: true
  category_translations:
    Diplomacy: دیپلماسی
    Economy: اقتصاد
    "US Policy": سیاست آمریکا
    "Israel Policy": سیاست اسرائیل
    "Military Operations": عملیات‌های نظامی
    "Inside Iran": درون ایران
    "Regional Actors": بازیگران منطقه‌ای
    International: بین‌المللی
    Other: سایر

# ---------------------------------------------------------------------------
# Mailer (post-publish stage). Sends each daily brief as an email broadcast
# via Resend. Disabled by default. Requires:
#   - RESEND_API_KEY in the environment (GitHub Secret in CI).
#   - A verified sending domain in Resend.
#   - One audience per language, created manually in the Resend dashboard.
#   - The subscribe-proxy Cloudflare Worker deployed so the public form can
#     add subscribers to those audiences.
# ---------------------------------------------------------------------------
mailer:
  enabled: true
  from_addr: "USrael War Daily Brief <usreal_war_daily_brief@k1monfared.com>"
  reply_to_en: "usrael.opposing330@passmail.net"
  reply_to_fa: "usrael_fa.unguided127@passmail.net"
  site_base_url: "https://k1monfared.github.io/news_reader"
  site_title_en: "USrael War on Iran: Daily Brief"
  site_title_fa: "جنگ آمریکا و اسرائیل علیه ایران: گزارش روزانه"
  audience_id_en: "7ec60861-ef0c-497d-84a7-8ca2ac58bf53"
  audience_id_fa: "c678f5df-c304-41fa-b641-e58ba5653cf7"
  # Sponsor link shown in each email footer between "View online" and
  # "Unsubscribe". Set to null to hide.
  sponsor_url: "https://k1monfared.github.io/sponsor.html"

# ---------------------------------------------------------------------------
# Empty brief handling
# ---------------------------------------------------------------------------
# When the Iran war brief has 0 reportable items (filter found nothing, or
# report.md is "No significant developments"), no broadcast is sent. Instead
# a consecutive-empty counter is tracked in data/empty_streak.json (committed
# to git so it survives fresh runners). Notifications to the owner are sent
# on days 3, 7, 14, 28 of the streak, then the pipeline stops completely.
empty_brief:
  enabled: true
  owner_email: "k1monfared@gmail.com"
  notify_days: [3, 7, 14, 28]
  stop_after_days: 28
  state_file: "data/empty_streak.json"
  stopped_flag: "data/PIPELINE_STOPPED"
