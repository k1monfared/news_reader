title: "USrael War on Iran: Daily Brief"
description: Automated daily intelligence digest on the USrael war on Iran
baseurl: "/news_reader"
url: "https://k1monfared.github.io"
kramdown:
  parse_block_html: true

plugins:
  - jekyll-feed

collections:
  fa_posts:
    output: true
    permalink: /fa/daily-brief/:year/:month/:day/:slug:output_ext

defaults:
  - scope:
      path: ""
      type: posts
    values:
      lang: en
  - scope:
      path: ""
      type: fa_posts
    values:
      lang: fa
      layout: post
  - scope:
      path: "fa"
    values:
      lang: fa

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
