title: "USrael War on Iran: Daily Brief"
description: Automated daily intelligence digest on the USrael war on Iran
baseurl: "/news_reader"
url: "https://k1monfared.github.io"

# Subscribe form target. Points at the deployed Cloudflare Worker
# (see subscribe-proxy/). Set to empty string to hide subscribe pages.
subscribe_proxy_url: "https://subscribe-proxy.usraelwar.workers.dev"

# Sponsor link shown in the nav bar and About page. Set to empty string
# to hide.
sponsor_url: "https://k1monfared.github.io/sponsor.html"
kramdown:
  parse_block_html: true

plugins:
  - jekyll-feed

collections:
  fa_posts:
    output: true
    permalink: /fa/daily-brief/:year/:month/:day/:slug:output_ext

defaults:
  - scope:
      path: ""
      type: posts
    values:
      lang: en
  - scope:
      path: ""
      type: fa_posts
    values:
      lang: fa
      layout: post
  - scope:
      path: "fa"
    values:
      lang: fa

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
