aljazeera:
  biases:
  - date_added: '2026-03-29'
    observation: Pro-Arab, critical of Israel, editorializes framing
    status: confirmed
  - date_added: '2026-03-29'
    observation: Systematically frames conflict as 'US-Israeli war on Iran' rather
      than using neutral descriptors like 'conflict' or 'strikes.' This appears in
      multiple headlines and characterizes the conflict as a coordinated campaign
      rather than isolated actions.
    status: suggested
  - date_added: '2026-03-29'
    observation: Emphasizes civilian casualties and infrastructure damage in Iran/allied
      states (universities, power plants, residential areas, children killed) while
      minimal coverage of Iranian attacks' impacts. Creates asymmetric victim framing.
    status: suggested
  - date_added: '2026-03-29'
    observation: Consistently uses attribution ('Iran accuses,' 'IRGC spokesperson
      says') when reporting Iranian claims but presents Israeli/US military actions
      as factual statements without similar hedging language.
    status: suggested
  - date_added: '2026-03-29'
    observation: Frames Trump's statements about regime change and oil seizure as
      factual developments ('Trump says Iran's had regime change') while consistently
      using attribution for Iranian claims. Amplifies Trump's 'boatloads of oil' rhetoric
      without quotation marks or distancing language, contrasting with France24's
      use of quotes around inflammatory statements.
    status: suggested
  - date_added: '2026-03-29'
    observation: Systematically emphasizes Iran's accusations and warnings ('Iran
      accuses US of plotting ground attack', 'IRGC spokesperson says Trump only understands
      the language of force') while framing Israeli military actions as operational
      decisions without equivalent attribution ('Netanyahu orders deeper Israeli invasion').
    status: suggested
  - date_added: '2026-03-29'
    observation: Includes extensive non-conflict sports coverage (cricket ball-tampering,
      MotoGP, CAF controversy) in same feed as war coverage, creating editorial equivalence
      between regional conflict and international sports stories that dilutes perceived
      severity of military developments.
    status: suggested
  display_name: Al Jazeera
  notes: Generally reliable but watch for editorialized framing
euronews:
  biases:
  - date_added: '2026-03-29'
    observation: Pan-European perspective, EU-aligned framing
    status: confirmed
  - date_added: '2026-03-29'
    observation: Provides significantly less coverage of the Iran conflict compared
      to other sources (7 relevant items vs. 25+ for others), with greater emphasis
      on European domestic stories (nightclub fire, German events, migration). Reflects
      EU-centric news priority hierarchy.
    status: suggested
  - date_added: '2026-03-29'
    observation: When covering conflict, emphasizes European institutional responses
      (Pope's statements, MEPs' actions, European leaders' reactions to Jerusalem
      incident) rather than military developments, framing through lens of European
      diplomatic/religious concerns.
    status: suggested
  - date_added: '2026-03-29'
    observation: Embeds conflict coverage within broader European cultural/lifestyle
      content (toy tourism, classical music sessions, aging research), creating a
      news hierarchy where Middle East war competes with domestic European features
      rather than dominating coverage. This dilutes conflict's perceived urgency compared
      to sources with focused conflict coverage.
    status: suggested
  - date_added: '2026-03-29'
    observation: 'Frames conflict through European institutional and religious lens
      disproportionately: Pope''s statements receive standalone coverage, MEPs'' Venice
      Biennale position gets dedicated article, Palm Sunday incident emphasized. This
      creates European-mediated understanding of conflict rather than direct regional
      focus.'
    status: suggested
  display_name: Euronews
  notes: Generally reliable, aggregates multiple European viewpoints
france24:
  biases:
  - date_added: '2026-03-29'
    observation: French/European perspective, moderate editorial tone
    status: confirmed
  - date_added: '2026-03-29'
    observation: Uses direct quotation marks around Trump's more inflammatory statements
      ('take the oil,' 'set on fire') which creates subtle distancing from these claims,
      suggesting editorial skepticism not present in reporting other leaders' statements.
    status: suggested
  - date_added: '2026-03-29'
    observation: Includes multiple analytical segments with expert commentary ('shares
      further insights,' 'brings you this analysis') positioning itself as interpretive
      rather than just reporting, reflecting editorial/European perspective framing.
    status: suggested
  - date_added: '2026-03-29'
    observation: Includes casualty figures and damage reports from both sides more
      consistently than Al Jazeera, though still emphasizes Iranian infrastructure
      damage. Creates more balanced victimization narrative than Al Jazeera's asymmetric
      focus.
    status: suggested
  - date_added: '2026-03-29'
    observation: Consistently includes expert analysis segments ('shares further insights',
      'brings you this analysis') that provide interpretive framing beyond straight
      reporting. This editorial approach positions France24 as analytical intermediary
      rather than direct news conveyor, distinguishing it from wire service style.
    status: suggested
  - date_added: '2026-03-29'
    observation: Uses distancing quotation marks selectively for Trump's more aggressive
      rhetoric ('take the oil', 'set on fire') while not applying same treatment to
      other leaders' statements, suggesting editorial judgment about credibility or
      inflammatory nature of specific claims.
    status: suggested
  - date_added: '2026-03-29'
    observation: Includes on-the-ground reporter perspectives with subjective assessments
      ('Beirut holding its breath', 'history is repeating itself') that blend reporting
      with atmospheric interpretation, creating more emotional/experiential framing
      than straightforward factual reporting.
    status: suggested
  display_name: France 24
  notes: Strong on diplomacy coverage
iranintl:
  biases:
  - date_added: '2026-03-29'
    observation: Anti-regime, pro-opposition, sometimes unverified
    status: confirmed
  display_name: Iran International
  notes: Mixed reliability, breaks stories early
reuters:
  biases:
  - date_added: '2026-03-29'
    observation: Neutral wire service
    status: confirmed
  display_name: Reuters
  notes: High reliability, fact-checked
