---
layout: default
---
<article>
  <header>
    <h1>{{ page.title }}</h1>
    <time datetime="{{ page.date | date_to_xmlschema }}">
      {{ page.date | date: "%B %d, %Y" }}
    </time>
    {% if page.sources_down.size > 0 %}
    <p class="sources-down">
      <strong>Note:</strong> The following sources were unreachable for this report:
      {{ page.sources_down | join: ", " }}
    </p>
    {% endif %}
  </header>

  <div class="post-content">
    {{ content }}
  </div>
</article>
