name = "subscribe-proxy"
main = "src/worker.ts"
compatibility_date = "2025-01-01"

# Non-secret config. Override per-deployment by editing this file or passing
# --var on the wrangler deploy command. Secrets (RESEND_API_KEY) are set with
# `wrangler secret put RESEND_API_KEY`, never committed.
[vars]
SITE_NAME = "USrael War Daily Brief"
FROM_ADDR = "USrael War Daily Brief <usreal_war_daily_brief@k1monfared.com>"
ALLOWED_ORIGINS = "https://k1monfared.github.io"
SUCCESS_URL = "https://k1monfared.github.io/news_reader/subscribed/"
CONFIRMATION_SENT_URL = "https://k1monfared.github.io/news_reader/confirmation-sent/"
ERROR_URL = "https://k1monfared.github.io/news_reader/subscribe/?err=1"
# AUDIENCE_ID and AUDIENCE_ID_FA are intentionally NOT set here. Use:
#   wrangler secret put AUDIENCE_ID
#   wrangler secret put AUDIENCE_ID_FA
# to keep them out of the repo (even though audience IDs are not strictly
# secrets, treating them as secrets keeps the Worker config portable).

# KV namespace for pending confirmation tokens and rate-limiting keys.
# Create one with: npx wrangler kv namespace create SUBSCRIBE_KV
# Then paste the printed id below.
[[kv_namespaces]]
binding = "SUBSCRIBE_KV"
id = "c9c411f9e2d4492492c1d5863d01cea8"
